<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTÓTIPO — tela de avaliação cega</title>
<!--
  PROTÓTIPO DESCARTÁVEL. Três variantes da tela `/avaliar`, trocáveis por
  ?variant=A|B|C na barra flutuante de baixo.

  A: "Duelo"      — duas colunas lado a lado, comparação simultânea.
  B: "Guiada"     — um passo de cada vez (ouça 1 → ouça 2 → vereditо).
  C: "Transições" — a unidade avaliada é a PASSAGEM entre duas faixas, não a
                    playlist inteira. Atenção: esta variante muda o experimento,
                    não só o layout. Ver relato no chat.

  Players são STUBS (proporção 16:9, sem vídeo): resolver video_id gasta cota da
  YouTube Data API e a pergunta aqui é de layout. Nada aqui persiste nada.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #07090A; --surface: #10140F; --surface-2: #171D17;
    --border: rgba(255,255,255,0.09); --border-strong: rgba(255,255,255,0.18);
    --text: #F2F6F1; --text-dim: #9FB0A2; --text-faint: #5C6A5E;
    --accent-1: #A9F44E; --accent-2: #4CC96B; --accent-3: #1F8A46;
    --accent-grad: linear-gradient(120deg, var(--accent-1), var(--accent-3));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ground); }
  body { color: var(--text); font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif; line-height: 1.5; padding-bottom: 96px; }
  h1, h2, h3 { font-family: 'Baloo 2', 'Plus Jakarta Sans', sans-serif; margin: 0; text-wrap: balance; }
  button { font-family: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  .wordmark { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; line-height: 1; }
  .wordmark .sound { color: var(--text); } .wordmark .park { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---- stub de player: só a caixa na proporção certa ---- */
  .player-stub { aspect-ratio: 16/9; width: 100%; border-radius: 14px; border: 1px dashed var(--border-strong);
    background: linear-gradient(160deg, #131811, #0B0E0A); display: flex; align-items: center; justify-content: center; text-align: center; }
  .player-stub .ps-play { display: block; font-size: 30px; color: var(--accent-1); margin-bottom: 6px; }
  .player-stub .ps-cap { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-faint); }
  .player-stub .ps-now { font-size: 14px; font-weight: 700; margin-top: 5px; padding: 0 14px; }

  .btn { border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
    padding: 11px 20px; font-weight: 700; font-size: 14px; }
  .btn:hover { border-color: var(--accent-1); }
  .btn-primary { background: var(--accent-grad); color: #0A0F09; border: none; }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
  textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
    font-family: inherit; font-size: 14px; padding: 11px 13px; resize: vertical; min-height: 62px; }

  /* ================= VARIANTE A — Duelo ================= */
  .a-page { max-width: 1180px; margin: 0 auto; padding: 30px 24px 20px; }
  .a-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
  .a-head h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
  .a-head p { margin: 4px 0 0; color: var(--text-dim); font-size: 14px; max-width: 56ch; }
  .a-duel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 860px) { .a-duel { grid-template-columns: 1fr; } }
  .a-col { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .a-col.picked { border-color: var(--accent-1); box-shadow: 0 0 0 1px var(--accent-1); }
  .a-col h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 9px; }
  .a-col h2 .tag { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-strong);
    display: grid; place-items: center; font-size: 12px; font-weight: 800; color: var(--accent-1); }
  .a-tracks { list-style: none; margin: 14px 0 0; padding: 0; }
  .a-tracks li { display: flex; gap: 11px; align-items: baseline; padding: 8px 9px; border-radius: 10px; cursor: pointer; }
  .a-tracks li:hover { background: var(--surface-2); }
  .a-tracks li.on { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent-1); }
  .a-tracks .i { color: var(--text-faint); font-size: 12px; width: 15px; }
  .a-tracks .t { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .a-tracks .ar { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .a-tracks .d { margin-left: auto; color: var(--text-faint); font-size: 12px; }
  .a-verdict { position: sticky; bottom: 96px; margin-top: 26px; background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 18px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .a-verdict .q { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 17px; }
  .a-verdict .opts { display: flex; gap: 9px; }
  .a-verdict .opt.sel { background: var(--accent-grad); color: #0A0F09; border-color: transparent; }

  /* ================= VARIANTE B — Guiada ================= */
  .b-page { max-width: 720px; margin: 0 auto; padding: 26px 22px; }
  .b-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .b-steps { display: flex; gap: 6px; }
  .b-steps i { width: 34px; height: 4px; border-radius: 4px; background: var(--surface-2); display: block; }
  .b-steps i.done { background: var(--accent-3); } .b-steps i.now { background: var(--accent-1); }
  .b-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px; }
  .b-kicker { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-1); font-weight: 800; }
  .b-card h1 { font-size: clamp(21px, 3.4vw, 27px); font-weight: 800; margin: 7px 0 6px; }
  .b-card p.sub { margin: 0 0 20px; color: var(--text-dim); font-size: 14px; }
  .b-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
  .b-chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; color: var(--text-dim); }
  .b-chip.on { border-color: var(--accent-1); color: var(--text); }
  .b-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  .b-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
  @media (max-width: 560px) { .b-choices { grid-template-columns: 1fr; } }
  .b-choice { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; color: var(--text); }
  .b-choice b { display: block; font-family: 'Baloo 2', sans-serif; font-size: 19px; margin-bottom: 3px; }
  .b-choice span { font-size: 12.5px; color: var(--text-dim); }
  .b-choice.sel { border-color: var(--accent-1); box-shadow: 0 0 0 1px var(--accent-1); }

  /* ================= VARIANTE C — Transições ================= */
  .c-page { max-width: 820px; margin: 0 auto; padding: 26px 22px; }
  .c-head { text-align: center; margin-bottom: 18px; }
  .c-head h1 { font-size: clamp(21px, 3.4vw, 28px); font-weight: 800; }
  .c-head p { color: var(--text-dim); font-size: 14px; margin: 6px auto 0; max-width: 50ch; }
  .c-dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0 20px; }
  .c-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); }
  .c-dots i.done { background: var(--accent-3); border-color: transparent; }
  .c-dots i.now { background: var(--accent-1); border-color: transparent; transform: scale(1.25); }
  .c-pair { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
  .c-pair.sel { border-color: var(--accent-1); box-shadow: 0 0 0 1px var(--accent-1); }
  .c-pair .c-lab { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); font-weight: 800; margin-bottom: 12px; }
  .c-seg { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  @media (max-width: 620px) { .c-seg { grid-template-columns: 1fr; } .c-arrow { transform: rotate(90deg); } }
  .c-half { background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 12px; }
  .c-half .cap { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
  .c-half .nm { font-size: 13.5px; font-weight: 700; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-half .ar { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-half .mini { margin-top: 10px; height: 34px; border-radius: 9px; border: 1px dashed var(--border-strong); display: grid; place-items: center; color: var(--accent-1); font-size: 14px; }
  .c-arrow { color: var(--text-faint); font-size: 19px; text-align: center; }
  .c-ask { display: flex; gap: 9px; justify-content: center; margin: 20px 0 4px; flex-wrap: wrap; }
  .c-ask .opt.sel { background: var(--accent-grad); color: #0A0F09; border-color: transparent; }

  .done-box { max-width: 560px; margin: 60px auto; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 36px 26px; }
  .done-box h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  .done-box p { color: var(--text-dim); font-size: 14px; }
  .done-box pre { text-align: left; background: var(--ground); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 11.5px; color: var(--text-dim); overflow-x: auto; margin-top: 18px; }

  /* ============ barra flutuante do protótipo (não faz parte do design) ============ */
  #proto-bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 999;
    display: flex; align-items: center; gap: 4px; background: #FFFFFF; color: #111; border-radius: 999px;
    padding: 5px 6px; box-shadow: 0 10px 34px -8px rgba(0,0,0,0.75); font-size: 12.5px; font-weight: 700; max-width: 94vw; }
  #proto-bar button { border: none; background: transparent; color: #111; font-size: 15px; padding: 5px 9px; border-radius: 999px; }
  #proto-bar button:hover { background: #EBEBEB; }
  #proto-bar .lab { padding: 0 8px; white-space: nowrap; }
  #proto-bar .st { padding: 0 9px; border-left: 1px solid #DDD; color: #666; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #proto-bar .rev { border-left: 1px solid #DDD; }
  #gabarito { position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%); z-index: 999; background: #FFF; color: #111;
    border-radius: 12px; padding: 10px 13px; font-size: 12px; box-shadow: 0 10px 34px -8px rgba(0,0,0,0.75); display: none; }
  #gabarito b { color: #1F8A46; }
</style>
</head>
<body>

<div id="app"></div>

<div id="proto-bar">
  <button id="prev" title="variante anterior (←)">‹</button>
  <span class="lab" id="proto-lab">A</span>
  <button id="next" title="próxima variante (→)">›</button>
  <span class="st" id="proto-state">estado</span>
  <button class="rev" id="reveal" title="só para o pesquisador">gabarito</button>
</div>
<div id="gabarito"></div>

<script>
// ---------------------------------------------------------------------------
// PROTÓTIPO. Sem framework, sem build, sem persistência: estado em memória.
// ---------------------------------------------------------------------------
const VARIANTES = { A: "Duelo lado a lado", B: "Guiada, um passo por vez", C: "Foco na transição" };
let DADOS = null;
let estado = { etapa: 1, escolha: null, comentario: "", tocando: { 1: 0, 2: 0 }, transicao: 0, votos: {}, enviado: false };

const params = new URLSearchParams(location.search);
let variante = (params.get("variant") || "A").toUpperCase();
if (!VARIANTES[variante]) variante = "A";

const el = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function stub(titulo, faixa) {
  return `<div class="player-stub"><div>
      <span class="ps-play">▶</span>
      <div class="ps-cap">${titulo} · player stub</div>
      <div class="ps-now">${faixa ? esc(faixa.track_name) + " — " + esc(faixa.artists) : "—"}</div>
    </div></div>`;
}

// ============================ VARIANTE A ============================
function VariantA() {
  const coluna = (n) => {
    const faixas = DADOS["lista_" + n];
    const ativa = faixas[estado.tocando[n]];
    return `
      <section class="a-col ${estado.escolha === String(n) ? "picked" : ""}">
        <h2><span class="tag">${n}</span> Lista ${n}</h2>
        ${stub("Lista " + n, ativa)}
        <ul class="a-tracks" data-lista="${n}">
          ${faixas.map((f, i) => `
            <li data-i="${i}" class="${i === estado.tocando[n] ? "on" : ""}">
              <span class="i num">${i + 1}</span>
              <span style="min-width:0">
                <span class="t">${esc(f.track_name)}</span><br>
                <span class="ar">${esc(f.artists)}</span>
              </span>
              <span class="d num">${f.duracao}</span>
            </li>`).join("")}
        </ul>
      </section>`;
  };
  const opt = (v, txt) => `<button class="btn opt ${estado.escolha === v ? "sel" : ""}" data-esc="${v}">${txt}</button>`;
  return el(`
    <div class="a-page">
      <div class="a-head">
        <div>
          <div class="wordmark"><span class="sound">sound</span><span class="park">park</span></div>
          <h1 style="margin-top:10px">Duas listas, as mesmas 8 músicas, ordens diferentes.</h1>
          <p>Ouça as duas — pode pular pelo meio. A pergunta não é quais músicas você gostou mais: é <b>qual ordem soou mais contínua</b>, como se uma música puxasse a próxima.</p>
        </div>
      </div>
      <div class="a-duel">${coluna(1)}${coluna(2)}</div>
      <div class="a-verdict">
        <span class="q">Qual soou mais coesa?</span>
        <span class="opts">${opt("1", "Lista 1")}${opt("2", "Lista 2")}${opt("empate", "Soaram iguais")}</span>
        <span style="flex:1 1 220px"><textarea id="cmt" placeholder="Por quê? (opcional)">${esc(estado.comentario)}</textarea></span>
        <button class="btn btn-primary" id="enviar" ${estado.escolha ? "" : "disabled"}>Enviar</button>
      </div>
    </div>`);
}

// ============================ VARIANTE B ============================
function VariantB() {
  const passo = estado.etapa;
  const pills = [1, 2, 3].map((i) => `<i class="${i < passo ? "done" : i === passo ? "now" : ""}"></i>`).join("");
  let corpo;
  if (passo === 1 || passo === 2) {
    const faixas = DADOS["lista_" + passo];
    const ativa = faixas[estado.tocando[passo]];
    corpo = `
      <div class="b-kicker">Passo ${passo} de 3</div>
      <h1>Ouça a Lista ${passo}</h1>
      <p class="sub">Não precisa ouvir inteira — o suficiente para sentir como uma música emenda na outra. ${passo === 2 ? "São as mesmas músicas do passo anterior, em outra ordem." : ""}</p>
      ${stub("Lista " + passo, ativa)}
      <div class="b-list" data-lista="${passo}">
        ${faixas.map((f, i) => `<button class="b-chip ${i === estado.tocando[passo] ? "on" : ""}" data-i="${i}">${i + 1}. ${esc(f.track_name)}</button>`).join("")}
      </div>
      <div class="b-actions"><button class="btn btn-primary" id="avancar">${passo === 1 ? "Ouvi. Ir para a Lista 2 →" : "Ouvi. Escolher →"}</button></div>`;
  } else {
    corpo = `
      <div class="b-kicker">Passo 3 de 3</div>
      <h1>Qual soou mais coesa?</h1>
      <p class="sub">Ordem, não repertório: qual das duas parecia uma sequência pensada.</p>
      <div class="b-choices">
        <button class="b-choice ${estado.escolha === "1" ? "sel" : ""}" data-esc="1"><b>Lista 1</b><span>a primeira que você ouviu</span></button>
        <button class="b-choice ${estado.escolha === "2" ? "sel" : ""}" data-esc="2"><b>Lista 2</b><span>a segunda</span></button>
      </div>
      <button class="btn opt ${estado.escolha === "empate" ? "sel" : ""}" data-esc="empate" style="width:100%;margin-bottom:16px">Soaram iguais</button>
      <textarea id="cmt" placeholder="Quer dizer por quê? (opcional)">${esc(estado.comentario)}</textarea>
      <div class="b-actions">
        <button class="btn" id="voltar">← Voltar</button>
        <button class="btn btn-primary" id="enviar" ${estado.escolha ? "" : "disabled"}>Enviar resposta</button>
      </div>`;
  }
  return el(`
    <div class="b-page">
      <div class="b-top">
        <div class="wordmark"><span class="sound">sound</span><span class="park">park</span></div>
        <div class="b-steps">${pills}</div>
      </div>
      <div class="b-card">${corpo}</div>
    </div>`);
}

// ============================ VARIANTE C ============================
// ATENÇÃO: esta variante muda a UNIDADE avaliada — a passagem entre duas
// faixas, não a playlist. Mede exatamente o que o algoritmo otimiza, mas
// deixa de medir "a playlist como experiência".
function VariantC() {
  const k = estado.transicao;
  const total = DADOS.lista_1.length - 1;
  const meia = (f, cap) => `
    <div class="c-half">
      <div class="cap">${cap}</div>
      <div class="nm">${esc(f.track_name)}</div>
      <div class="ar">${esc(f.artists)}</div>
      <div class="mini">▶ 20s</div>
    </div>`;
  const par = (n, letra) => {
    const l = DADOS["lista_" + n];
    return `
      <div class="c-pair ${estado.votos[k] === letra ? "sel" : ""}" data-par="${letra}">
        <div class="c-lab">Passagem ${letra}</div>
        <div class="c-seg">${meia(l[k], "fim de")}<div class="c-arrow">→</div>${meia(l[k + 1], "começo de")}</div>
      </div>`;
  };
  const opt = (v, t) => `<button class="btn opt ${estado.votos[k] === v ? "sel" : ""}" data-par="${v}">${t}</button>`;
  return el(`
    <div class="c-page">
      <div class="c-head">
        <div class="wordmark" style="margin-bottom:14px"><span class="sound">sound</span><span class="park">park</span></div>
        <h1>Qual passagem soou mais natural?</h1>
        <p>São ${total} passagens. Em cada uma você ouve o fim de uma música emendando no começo da próxima, de dois jeitos.</p>
        <div class="c-dots">${Array.from({ length: total }, (_, i) => `<i class="${estado.votos[i] !== undefined ? "done" : ""} ${i === k ? "now" : ""}"></i>`).join("")}</div>
      </div>
      ${par(1, "A")}${par(2, "B")}
      <div class="c-ask">${opt("A", "A soou melhor")}${opt("B", "B soou melhor")}${opt("igual", "Igual")}</div>
      <div class="b-actions" style="justify-content:space-between">
        <button class="btn" id="cvoltar" ${k === 0 ? "disabled" : ""}>← Anterior</button>
        <button class="btn btn-primary" id="cavancar" ${estado.votos[k] === undefined ? "disabled" : ""}>${k === total - 1 ? "Terminar" : "Próxima →"}</button>
      </div>
    </div>`);
}

function Fim() {
  const resumo = variante === "C"
    ? { variante, votos: estado.votos }
    : { variante, escolha: estado.escolha, comentario: estado.comentario };
  return el(`
    <div class="done-box">
      <h1>Obrigado!</h1>
      <p>É isso — sua resposta foi registrada.</p>
      <pre>// STUB: nada foi gravado. No produto isso vira uma linha em
// produto/logs/eventos.jsonl
${esc(JSON.stringify(resumo, null, 2))}</pre>
    </div>`);
}

// ============================ render + eventos ============================
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!DADOS) { app.appendChild(el(`<div class="done-box"><h1>Carregando…</h1><p>O motor está lendo o catálogo.</p></div>`)); return; }
  app.appendChild(estado.enviado ? Fim() : { A: VariantA, B: VariantB, C: VariantC }[variante]());
  ligar();
  atualizarBarra();
}

function ligar() {
  const app = document.getElementById("app");
  app.querySelectorAll("[data-esc]").forEach((n) => n.onclick = () => { estado.escolha = n.dataset.esc; render(); });
  app.querySelectorAll(".a-tracks li").forEach((li) => li.onclick = () => {
    estado.tocando[li.closest("[data-lista]").dataset.lista] = +li.dataset.i; render();
  });
  app.querySelectorAll(".b-chip").forEach((c) => c.onclick = () => {
    estado.tocando[c.closest("[data-lista]").dataset.lista] = +c.dataset.i; render();
  });
  app.querySelectorAll("[data-par]").forEach((n) => n.onclick = () => {
    estado.votos[estado.transicao] = n.dataset.par; render();
  });
  const cmt = app.querySelector("#cmt");
  if (cmt) cmt.oninput = () => { estado.comentario = cmt.value; atualizarBarra(); };
  const on = (id, fn) => { const b = app.querySelector(id); if (b) b.onclick = fn; };
  on("#avancar", () => { estado.etapa++; render(); });
  on("#voltar", () => { estado.etapa--; render(); });
  on("#cavancar", () => {
    if (estado.transicao === DADOS.lista_1.length - 2) estado.enviado = true; else estado.transicao++;
    render();
  });
  on("#cvoltar", () => { estado.transicao--; render(); });
  on("#enviar", () => { estado.enviado = true; render(); });
}

// Regra 5 do skill: o estado relevante fica visível o tempo todo.
function atualizarBarra() {
  document.getElementById("proto-lab").textContent = variante + " (" + VARIANTES[variante] + ")";
  const s = variante === "B" ? `etapa ${estado.etapa}/3 · escolha ${estado.escolha || "—"}`
    : variante === "C" ? `transição ${estado.transicao + 1}/${DADOS ? DADOS.lista_1.length - 1 : "?"} · votos ${Object.keys(estado.votos).length}`
    : `tocando ${estado.tocando[1] + 1}|${estado.tocando[2] + 1} · escolha ${estado.escolha || "—"}`;
  document.getElementById("proto-state").textContent = s + (estado.enviado ? " · ENVIADO" : "");
}

function trocar(passo) {
  const chaves = Object.keys(VARIANTES);
  variante = chaves[(chaves.indexOf(variante) + passo + chaves.length) % chaves.length];
  const u = new URL(location); u.searchParams.set("variant", variante); history.replaceState({}, "", u);
  estado = { etapa: 1, escolha: null, comentario: "", tocando: { 1: 0, 2: 0 }, transicao: 0, votos: {}, enviado: false };
  render();
}
document.getElementById("prev").onclick = () => trocar(-1);
document.getElementById("next").onclick = () => trocar(1);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") trocar(-1);
  if (e.key === "ArrowRight") trocar(1);
});
document.getElementById("reveal").onclick = () => {
  const g = document.getElementById("gabarito");
  if (g.style.display === "block") { g.style.display = "none"; return; }
  const gb = DADOS._gabarito;
  g.innerHTML = `<b>só para o pesquisador</b><br>
    Lista 1 = ${gb.lista_1.braco} · Δ BPM ${gb.lista_1.delta_bpm} · ${gb.lista_1.pct_compativel}% compatível<br>
    Lista 2 = ${gb.lista_2.braco} · Δ BPM ${gb.lista_2.delta_bpm} · ${gb.lista_2.pct_compativel}% compatível`;
  g.style.display = "block";
};

render();
fetch("/api/prototipo/par").then((r) => r.json()).then((d) => { DADOS = d; render(); });
</script>
